[build]
  command = "npm ci --include=dev --no-audit --no-fund && npm run build"
  publish = "dist"

# Single-page app: let React Router handle every client route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Allow this site (and only this site) to use the microphone for voice questions.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(self)"
